name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    name: Citation metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the validators
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check cffconvert==2.0.0 PyYAML==6.0.3

      # The template carries its skeleton at docs/CITATION.template.cff and no
      # CITATION.cff; a project carries CITATION.cff after setup step 1.
      - name: Validate the citation file with cffconvert
        run: |
          if [ -f CITATION.cff ]; then cff=CITATION.cff; else cff=docs/CITATION.template.cff; fi
          "$RUNNER_TEMP/venv/bin/cffconvert" --validate --infile "$cff"

      - name: Validate the citation file against schema 1.2.0 through a plain YAML loader
        env:
          PYTHON: ${{ runner.temp }}/venv/bin/python
        run: tools/check.sh citation

  reuse:
    name: Licensing information
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install reuse
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check reuse==6.2.0

      - name: Check every file for its licence and copyright, as REUSE 3.3 defines it
        env:
          REUSE: ${{ runner.temp }}/venv/bin/reuse
        run: tools/check.sh reuse

  placeholders:
    name: Placeholders
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The start page is the first thing a visitor reads; no placeholder of
      # the skeleton may reach it, in the template or in a repository made
      # from it.
      - name: Check that README.md carries no placeholder
        run: tools/check.sh readme

      # In a repository created from the template, the setup is done once
      # docs/TEMPLATE.md and the skeletons are gone and no file carries a
      # placeholder, a TEMPLATE marker or the name of the template.
      - name: Check that the setup of a new repository is complete
        if: github.repository != 'mtorun0x7cd/template'
        run: tools/check.sh setup
