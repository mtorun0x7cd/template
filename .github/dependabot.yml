# Every repository keeps the github-actions block, which updates the pinned
# actions. A project adds one block for each package ecosystem it carries (pip,
# maven, npm, nuget, composer, ...); a finished project kept as a record keeps
# the github-actions block alone.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
