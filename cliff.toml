#
# Release notes from the commit history, built with git-cliff
# (https://git-cliff.org). Commits follow Conventional Commits
# (https://www.conventionalcommits.org), so the type of a commit decides
# the section it is listed under; a commit without a type is left out.
#
#   git cliff --unreleased --strip header   notes for what is not tagged yet
#   git cliff --latest --strip header       notes for the newest tag
#   git cliff --output CHANGELOG.md         the whole history

[changelog]
header = """
# Changelog\n
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group }}
{% for commit in entry.commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^build", group = "Build" },
  { message = "^ci", group = "Continuous integration" },
  { message = "^style", group = "Style" },
  { message = "^revert", group = "Reverts" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "Chores" },
]
filter_commits = true
topo_order_commits = true
sort_commits = "oldest"
